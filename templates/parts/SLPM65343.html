<div id="LIST">
	
</div>
<script type="text/javascript">

function htmlFormat(){
	for (x in data){
		var t=data[x];
		var frame=document.createElement('section');
		document.getElementById("LIST").appendChild(frame);
		var header=document.createElement('h1');
		frame.appendChild(header);
		var table=document.createElement('table');
		frame.appendChild(table);
		switch(x){
			case "head":
				header.innerHTML="ヘッドフレーム";
				var sheet=["名前","コメント","","重量","EP","外装HP","防御力","ロックオンスピード","",""];
				for(var i=0;i<t.length;i++){
					var tr=document.createElement('tr');
					table.appendChild(tr);
					for(var n=0;n<t[i].length;n++){
						if(sheet[n]!=""){
							var td=document.createElement('td');
							tr.appendChild(td);
							if(n==1){
								td.style.display="none";
							}else{
								td.innerHTML=t[i][n];
							}
						}
					}
				}
				break;
			case "main":
				header.innerHTML="メインフレーム";
				for(var i=0;i<t.length;i++){var tr=document.createElement('tr');table.appendChild(tr);for(var n=0;n<t[i].length;n++){var td=document.createElement('td');tr.appendChild(td);if(n==1){td.style.display="none";}else{td.innerHTML=t[i][n];}}}
				break;
			case "arm":
				header.innerHTML="アームフレーム";

				break;

				break;
		}
	}
}

}
